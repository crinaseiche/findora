[project]
name = "findora"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "langchain-google-genai>=4.5.2",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
